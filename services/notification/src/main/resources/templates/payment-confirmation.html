<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Payment Confirmation</title>
    <style>
        body{
            margin:0;
            padding:0;
            background: #629eda;
            font-family:Arial, Helvetica, sans-serif;
        }

        .wrapper{
            width:100%;
            padding:40px 0;
        }

        .container{
            width:600px;
            margin:0 auto;
            background:#ffffff;
            border-radius:8px;
            box-shadow:0 2px 8px rgba(0,0,0,0.08);
            overflow:hidden;
        }

        .header{
            background:#0d6efd;
            color:white;
            padding:20px;
            font-size:20px;
            font-weight:bold;
        }

        .content{
            padding:25px;
        }

        .row{
            padding:12px 0;
            border-bottom:1px solid #eee;
        }

        .label{
            font-weight:bold;
            color:#333;
        }

        .value{
            float:right;
            color:#555;
        }

        .amount{
            font-size:18px;
            font-weight:bold;
            color:#0d6efd;
        }

        .footer{
            background:#fafafa;
            padding:15px 25px;
            font-size:12px;
            color:#777;
            text-align:center;
        }

        .success{
            background:#e7f5ff;
            border-left:4px solid #0d6efd;
            padding:12px;
            margin-bottom:20px;
            color:#0b5ed7;
            font-size:14px;
        }
    </style>
</head>

<body>
<div class="wrapper">
    <div class="container">

        <div class="header">
            Payment Confirmation
        </div>

        <div class="content">

            <div class="success">
                Your payment has been successfully processed.
            </div>

            <div class="row">
                <span class="label">Customer Name</span>
                <span class="value" th:text="${customerName}"></span>
            </div>

            <div class="row">
                <span class="label">Order Reference</span>
                <span class="value" th:text="${orderReference}"></span>
            </div>

            <div class="row">
                <span class="label">Amount Paid</span>
                <span class="value amount" th:text="${amount}"></span>
            </div>

        </div>

        <div class="footer">
            This is an automated message. Please do not reply to this email.<br/>
            © 2026 Your Company. All rights reserved.
        </div>

    </div>
</div>
</body>
</html>
